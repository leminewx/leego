    <!-- Tailwind 配置 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#6C5CE7', // 主色调：紫色
                        secondary: '#00D2D3', // 辅助色：青色
                        accent: '#FF3E78',    // 强调色：亮红
                        success: '#00B894',   // 成功色：绿色
                        dark: {
                            100: '#2D3436',
                            200: '#212529',
                            300: '#1A1A2E',
                            400: '#16213E',
                            500: '#0F3460'
                        }
                    },
                    fontFamily: {
                        inter: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 6s ease-in-out infinite',
                        'glow': 'glow 2s ease-in-out infinite alternate',
                        'flow': 'flow 20s linear infinite',
                        'flicker': 'flicker 3s ease-in-out infinite alternate',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        },
                        glow: {
                            '0%': { boxShadow: '0 0 10px rgba(108, 92, 231, 0.3)' },
                            '100%': { boxShadow: '0 0 20px rgba(108, 92, 231, 0.7)' },
                        },
                        flow: {
                            '0%': { backgroundPosition: '0% 0%' },
                            '100%': { backgroundPosition: '100% 100%' },
                        },
                        flicker: {
                            '0%, 19.999%, 22%, 62.999%, 64%, 64.999%, 70%, 100%': { opacity: '1' },
                            '20%, 21.999%, 63%, 63.999%, 65%, 69.999%': { opacity: '0.4' },
                        }
                    }
                },
            }
        }
    </script>

    <!-- 自定义样式 -->
    <style type="text/tailwindcss">
        @layer utilities {
      .content-auto {
        content-visibility: auto;
      }
      .text-shadow {
        text-shadow: 0 0 15px rgba(108, 92, 231, 0.7);
      }
      .text-shadow-lg {
        text-shadow: 0 0 20px rgba(0, 210, 211, 0.8);
      }
      .bg-grid {
        background-image: 
          linear-gradient(rgba(108, 92, 231, 0.1) 1px, transparent 1px),
          linear-gradient(90deg, rgba(108, 92, 231, 0.1) 1px, transparent 1px);
        background-size: 20px 20px;
      }
      .bg-grid-lg {
        background-image: 
          linear-gradient(rgba(0, 210, 211, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 210, 211, 0.05) 1px, transparent 1px);
        background-size: 50px 50px;
      }
      .grid-animation {
        animation: gridMove 15s linear infinite;
      }
      .grid-animation-reverse {
        animation: gridMoveReverse 20s linear infinite;
      }
      @keyframes gridMove {
        from { background-position: 0 0; }
        to { background-position: 20px 20px; }
      }
      @keyframes gridMoveReverse {
        from { background-position: 0 0; }
        to { background-position: -50px -50px; }
      }
      .glass-effect {
        backdrop-filter: blur(10px);
        background: rgba(26, 26, 46, 0.6);
        border: 1px solid rgba(108, 92, 231, 0.2);
      }
      .pulse-border {
        position: relative;
      }
      .pulse-border::after {
        content: '';
        position: absolute;
        top: -2px;
        left: -2px;
        right: -2px;
        bottom: -2px;
        border-radius: inherit;
        border: 1px solid transparent;
        background: linear-gradient(45deg, #6C5CE7, #00D2D3, #FF3E78) border-box;
        -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        animation: rotate 6s linear infinite;
      }
      @keyframes rotate {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
      .input-focus {
        @apply focus:border-primary focus:ring-2 focus:ring-primary/20 focus:outline-none;
      }
      .btn-hover {
        @apply hover:shadow-lg hover:shadow-primary/20 hover:-translate-y-0.5 transition-all duration-300;
      }
      .bg-gradient-dynamic {
        background: linear-gradient(
          135deg,
          rgba(16, 23, 42, 0.9) 0%,
          rgba(26, 26, 46, 0.95) 50%,
          rgba(16, 23, 42, 0.9) 100%
        );
        background-size: 200% 200%;
        animation: flow 15s ease infinite;
      }
      .connecting-dots {
        background-image: radial-gradient(rgba(108, 92, 231, 0.3) 1px, transparent 1px);
        background-size: 30px 30px;
      }
    }
  </style>

    <!-- JavaScript -->
    <script>
        // 创建动态粒子和连接线效果
        function createDynamicParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 30;
            const particles = [];

            // 创建粒子
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');

                // 随机属性
                const size = Math.random() * 2 + 1;
                const posX = Math.random() * 100;
                const posY = Math.random() * 100;
                const speedX = (Math.random() - 0.5) * 0.1;
                const speedY = (Math.random() - 0.5) * 0.1;
                const opacity = Math.random() * 0.6 + 0.2;

                // 随机颜色
                const colors = ['#6C5CE7', '#00D2D3', '#FF3E78'];
                const color = colors[Math.floor(Math.random() * colors.length)];

                // 设置样式
                particle.style.cssText = `
          position: absolute;
          width: ${size}px;
          height: ${size}px;
          background: ${color};
          opacity: ${opacity};
          border-radius: 50%;
          top: ${posY}%;
          left: ${posX}%;
          box-shadow: 0 0 ${size * 5}px ${color}80;
          z-index: -1;
        `;

                particlesContainer.appendChild(particle);

                // 存储粒子信息用于动画
                particles.push({
                    element: particle,
                    x: posX,
                    y: posY,
                    speedX,
                    speedY,
                    size
                });
            }

            // 粒子动画循环
            function animateParticles() {
                particles.forEach(particle => {
                    // 更新位置
                    particle.x += particle.speedX;
                    particle.y += particle.speedY;

                    // 边界检测
                    if (particle.x < 0) particle.x = 100;
                    if (particle.x > 100) particle.x = 0;
                    if (particle.y < 0) particle.y = 100;
                    if (particle.y > 100) particle.y = 0;

                    // 应用位置
                    particle.element.style.left = `${particle.x}%`;
                    particle.element.style.top = `${particle.y}%`;
                });

                requestAnimationFrame(animateParticles);
            }

            // 启动动画
            animateParticles();
        }

        // 动态更新数据指标
        function updateMetrics() {
            // CPU负载在30-50%之间波动
            const cpuLoad = (30 + Math.random() * 20).toFixed(1);
            document.getElementById('cpuLoad').textContent = `${cpuLoad}%`;

            // 内存使用在50-70%之间波动
            const memoryUsage = (50 + Math.random() * 20).toFixed(1);
            document.getElementById('memoryUsage').textContent = `${memoryUsage}%`;

            // 请求总数递增
            const totalRequests = parseInt(document.getElementById('totalRequests').textContent.replace(',', '')) + Math.floor(Math.random() * 10);
            document.getElementById('totalRequests').textContent = totalRequests.toLocaleString();

            // 成功率在99.5-99.9%之间波动
            const successRate = (99.5 + Math.random() * 0.4).toFixed(1);
            document.getElementById('successRate').textContent = `${successRate}%`;

            // 失败率 = 100 - 成功率
            const failureRate = (100 - parseFloat(successRate)).toFixed(1);
            document.getElementById('failureRate').textContent = `${failureRate}%`;

            // 延迟指标小范围波动
            const p50Base = 42;
            const p50Latency = Math.floor(p50Base + (Math.random() * 10 - 5));
            document.getElementById('p50Latency').textContent = `${p50Latency}ms`;

            const p90Base = 87;
            const p90Latency = Math.floor(p90Base + (Math.random() * 15 - 7));
            document.getElementById('p90Latency').textContent = `${p90Latency}ms`;

            const p99Base = 156;
            const p99Latency = Math.floor(p99Base + (Math.random() * 20 - 10));
            document.getElementById('p99Latency').textContent = `${p99Latency}ms`;

            // 定期更新
            setTimeout(updateMetrics, 3000);
        }

        // 动态更新数据图表高度
        function animateChartBars() {
            const bars = document.querySelectorAll('.h-16 > div');
            bars.forEach(bar => {
                const randomHeight = Math.floor(Math.random() * 4) + 1; // 1-4
                bar.style.height = `${(randomHeight / 4) * 100}%`;
            });

            // 定期更新图表
            setTimeout(animateChartBars, 2000);
        }

        // 密码显示/隐藏切换
        const togglePassword = document.getElementById('togglePassword');
        const password = document.getElementById('password');

        togglePassword.addEventListener('click', () => {
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);

            // 切换图标
            togglePassword.querySelector('i').classList.toggle('fa-eye');
            togglePassword.querySelector('i').classList.toggle('fa-eye-slash');
        });

        // 登录表单提交处理
        const loginForm = document.getElementById('loginForm');

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();

            // 获取表单数据
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;

            // 模拟登录过程
            const submitButton = loginForm.querySelector('button[type="submit"]');
            const originalText = submitButton.innerHTML;

            submitButton.disabled = true;
            submitButton.innerHTML = '<i class="fa fa-spinner fa-spin mr-2"></i> 登录中...';

            // 模拟API请求延迟
            setTimeout(() => {
                // 模拟登录成功
                submitButton.innerHTML = '<i class="fa fa-check mr-2"></i> 登录成功';
                submitButton.classList.remove('bg-primary');
                submitButton.classList.add('bg-green-500');

                // 跳转到管理系统主页
                setTimeout(() => {
                    window.location.href = '#dashboard';
                }, 1000);
            }, 1500);
        });

        // 添加输入框动画效果
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('scale-[1.01]');
                input.parentElement.style.transition = 'transform 0.3s ease';
            });

            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('scale-[1.01]');
            });
        });

        // 页面加载完成后初始化动态效果
        window.addEventListener('load', () => {
            createDynamicParticles();
            animateChartBars();
            updateMetrics();
        });
    </script>
