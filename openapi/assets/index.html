<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leego OpenAPI</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #16213a;
    --line: #24314f;
    --text: #e2e8f0;
    --muted: #93a3bb;
    --accent: #38bdf8;
    --method: #22c55e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .version { color: var(--muted); font-size: 12px; }
  header input {
    margin-left: auto;
    width: 260px;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: #0b1222;
    color: var(--text);
    outline: none;
  }
  main { flex: 1; display: flex; min-height: 0; }
  nav {
    width: 340px;
    border-right: 1px solid var(--line);
    overflow-y: auto;
    padding: 12px;
  }
  nav button {
    width: 100%;
    text-align: left;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 8px;
    color: var(--text);
    padding: 8px 10px;
    margin-bottom: 6px;
    cursor: pointer;
    font: inherit;
  }
  nav button:hover { background: #1c2942; }
  nav button.active { border-color: var(--accent); background: #1c2942; }
  nav .method {
    display: inline-block;
    min-width: 52px;
    color: var(--method);
    font-weight: 700;
    font-size: 12px;
    text-transform: uppercase;
  }
  nav .path { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
  section { flex: 1; overflow-y: auto; padding: 20px; }
  .empty { color: var(--muted); }
  h2 { font-size: 18px; margin: 0 0 4px; }
  .summary { color: var(--muted); margin-bottom: 16px; }
  .tag {
    display: inline-block;
    padding: 2px 8px;
    margin: 0 6px 6px 0;
    border-radius: 999px;
    background: #1e2a47;
    color: var(--accent);
    font-size: 12px;
  }
  pre {
    background: #0b1222;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px;
    overflow: auto;
    font-size: 12.5px;
    line-height: 1.6;
  }
  a { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Leego OpenAPI</h1>
  <span class="version" id="version"></span>
  <input id="search" type="search" placeholder="搜索路径、方法或名称">
</header>
<main>
  <nav id="routes"><p class="empty">加载中...</p></nav>
  <section id="detail"><p class="empty">选择左侧接口查看详情</p></section>
</main>
<script>
  const routesBox = document.getElementById('routes');
  const detailBox = document.getElementById('detail');
  const searchBox = document.getElementById('search');
  const specURL = location.pathname.replace(/\/+$/, '') + '/openapi.json';

  let entries = [];

  function render(list) {
    routesBox.textContent = '';
    if (list.length === 0) {
      const empty = document.createElement('p');
      empty.className = 'empty';
      empty.textContent = '没有匹配的接口';
      routesBox.appendChild(empty);
      return;
    }

    for (const item of list) {
      const button = document.createElement('button');
      button.innerHTML = '<span class="method"></span><span class="path"></span>';
      button.querySelector('.method').textContent = item.method;
      button.querySelector('.path').textContent = item.path;
      button.addEventListener('click', () => {
        for (const node of routesBox.querySelectorAll('button')) {
          node.classList.remove('active');
        }
        button.classList.add('active');
        show(item);
      });
      routesBox.appendChild(button);
    }
  }

  function show(item) {
    detailBox.textContent = '';
    const title = document.createElement('h2');
    title.textContent = item.method.toUpperCase() + ' ' + item.path;
    detailBox.appendChild(title);

    const summary = document.createElement('p');
    summary.className = 'summary';
    summary.textContent = item.operation.summary || item.operation.operationId || '';
    detailBox.appendChild(summary);

    for (const tag of item.operation.tags || []) {
      const span = document.createElement('span');
      span.className = 'tag';
      span.textContent = tag;
      detailBox.appendChild(span);
    }

    const pre = document.createElement('pre');
    pre.textContent = JSON.stringify(item.operation, null, 2);
    detailBox.appendChild(pre);
  }

  function filter(keyword) {
    keyword = keyword.trim().toLowerCase();
    if (!keyword) {
      render(entries);
      return;
    }

    render(entries.filter((item) => {
      const haystack = (item.method + ' ' + item.path + ' ' + (item.operation.operationId || '')).toLowerCase();
      return haystack.includes(keyword);
    }));
  }

  searchBox.addEventListener('input', (event) => filter(event.target.value));

  fetch(specURL)
    .then((resp) => {
      if (!resp.ok) {
        throw new Error('HTTP ' + resp.status);
      }
      return resp.json();
    })
    .then((spec) => {
      document.getElementById('version').textContent = 'v' + (spec.info?.version || '');
      entries = [];
      for (const [path, item] of Object.entries(spec.paths || {})) {
        for (const [method, operation] of Object.entries(item)) {
          entries.push({ path, method, operation });
        }
      }
      entries.sort((a, b) => a.path.localeCompare(b.path) || a.method.localeCompare(b.method));
      render(entries);
    })
    .catch((err) => {
      routesBox.textContent = '';
      const failed = document.createElement('p');
      failed.className = 'empty';
      failed.textContent = '加载 openapi.json 失败: ' + err.message;
      routesBox.appendChild(failed);
    });
</script>
</body>
</html>
